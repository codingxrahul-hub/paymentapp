<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <link rel="stylesheet" href="style.css">
    <script src="function.js" defer></script>
</head>
<body>

<!-- Confetti Canvas -->
<canvas id="confettiCanvas"></canvas>

<div class="container">

    <!-- HEADER -->
    <div class="header">

        <div class="nav-icons">
            <span class="back-arrow" style="cursor:pointer;">&#10094;</span>
            <span class="share-icon" style="font-size:22px;cursor:pointer;">&#8942;</span>
        </div>

        <!-- Animated circle + checkmark -->
        <div class="circle-completion">
            <svg viewBox="0 0 100 100" class="circle-svg-payment">
                <circle cx="50" cy="50" r="44" class="circle-bg-payment"></circle>
                <circle cx="50" cy="50" r="44" class="circle-fill-payment"></circle>
            </svg>
            <svg class="check-svg" viewBox="0 0 52 52">
                <polyline class="check-path" points="12,26 22,38 40,16"/>
            </svg>
            <span class="ripple r1"></span>
            <span class="ripple r2"></span>
            <span class="ripple r3"></span>
        </div>

        <p class="status-text anim-fadeslide" style="--d:0.9s">Payment Successful!</p>
        <h1 class="amount anim-fadeslide" style="--d:1.1s">&#8377;0</h1>
        <p class="recipient anim-fadeslide" style="--d:1.25s">to Guest</p>

    </div>

    <!-- DETAILS CARD -->
    <div class="details-card anim-slideup" style="--d:1.4s">
        <div class="row">
            <span class="label">Received By</span>
            <span class="value" id="upiId">738855312@ybl</span>
        </div>
        <hr class="divider">
        <div class="row">
            <span class="label">Payment Mode</span>
            <span class="value">Pocket UPI</span>
        </div>
        <hr class="divider">
        <div class="row">
            <span class="label">Transaction ID</span>
            <span class="value txn-id" id="txnId">TXN2025051308472</span>
        </div>
        <div class="view-more">View more details &#8964;</div>
    </div>

    <!-- STATUS PILLS -->
    <div class="status-pills anim-fadeslide" style="--d:1.5s">
        <div class="pill">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="#22c55e" stroke-width="2"/>
                <polyline points="8,12 11,15 16,9" stroke="#22c55e" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Deducted
        </div>
        <div class="pill-connector"></div>
        <div class="pill">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="#22c55e" stroke-width="2"/>
                <polyline points="8,12 11,15 16,9" stroke="#22c55e" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Processed
        </div>
        <div class="pill-connector"></div>
        <div class="pill">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="#22c55e" stroke-width="2"/>
                <polyline points="8,12 11,15 16,9" stroke="#22c55e" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Received
        </div>
    </div>

    <!-- OFFER BANNER -->
    <div class="offer-banner anim-slideup" style="--d:1.9s">
        <div class="banner-content">
            <p class="offer-title">&#127881; 1% Cashback on UPI Spends</p>
            <p class="offer-sub">on FD-Backed First Credit Card</p>
            <button class="avail-btn">Avail Offer</button>
        </div>
        <div class="mock-card">
            <span class="card-shine"></span>
            <span class="card-label">first</span>
        </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="action-btns anim-fadeslide" style="--d:2.1s">
        <button class="action-btn" onclick="window.location.href='index.html'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"
                    stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <polyline points="9,22 9,12 15,12 15,22"
                    stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
            Home
        </button>
        <button class="action-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <rect x="4" y="4" width="16" height="12" rx="2"
                    stroke="currentColor" stroke-width="2"/>
                <path d="M8 20h8M12 16v4" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round"/>
            </svg>
            Receipt
        </button>
        <button class="action-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <circle cx="18" cy="5"  r="3" stroke="currentColor" stroke-width="2"/>
                <circle cx="6"  cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                <circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="2"/>
                <line x1="8.59"  y1="13.51" x2="15.42" y2="17.49"
                    stroke="currentColor" stroke-width="2"/>
                <line x1="15.41" y1="6.51"  x2="8.59"  y2="10.49"
                    stroke="currentColor" stroke-width="2"/>
            </svg>
            Share
        </button>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <div class="upi_logo"></div>
        <h2 class="mobi_logo"></h2>
    </div>

</div>

<script>
/* ── CONFETTI ─────────────────────────────────── */
(function () {
    var canvas = document.getElementById('confettiCanvas');
    var ctx    = canvas.getContext('2d');
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;

    var COLORS = ['#0052cc','#22c55e','#f59e0b','#ef4444','#a855f7','#ffffff','#38bdf8','#fb923c'];
    var pieces = [];

    for (var i = 0; i < 130; i++) {
        pieces.push({
            x: Math.random() * canvas.width,
            y: -10 - Math.random() * 180,
            r: 4 + Math.random() * 6,
            color: COLORS[Math.floor(Math.random() * COLORS.length)],
            rot: Math.random() * Math.PI * 2,
            vx: (Math.random() - 0.5) * 3.5,
            vy: 1.5 + Math.random() * 3,
            vr: (Math.random() - 0.5) * 0.14,
            shape: Math.random() > 0.45 ? 'rect' : 'circle',
            opacity: 1
        });
    }

    var startTime = null;
    var DURATION  = 3600;

    function draw(ts) {
        if (!startTime) startTime = ts;
        var elapsed = ts - startTime;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        var alive = false;
        pieces.forEach(function (p) {
            p.x   += p.vx;
            p.y   += p.vy;
            p.rot += p.vr;
            p.vy  += 0.055;
            if (elapsed > DURATION - 900) p.opacity = Math.max(0, p.opacity - 0.013);
            if (p.y < canvas.height + 20) alive = true;

            ctx.save();
            ctx.globalAlpha = p.opacity;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            if (p.shape === 'rect') {
                ctx.fillRect(-p.r / 2, -p.r / 1.5, p.r, p.r * 1.4);
            } else {
                ctx.beginPath();
                ctx.arc(0, 0, p.r / 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        });

        if (alive && elapsed < DURATION + 500) requestAnimationFrame(draw);
        else canvas.style.display = 'none';
    }

    setTimeout(function () { requestAnimationFrame(draw); }, 850);
})();

/* ── RANDOM TXN ID ───────────────────────────── */
document.addEventListener('DOMContentLoaded', function () {
    var txnEl = document.getElementById('txnId');
    if (txnEl) txnEl.textContent = 'TXN' + Date.now().toString().slice(-10).toUpperCase();
});
</script>

</body>
</html>
